# Add other extra configuration here.\n

[ui]
display_sleep_sec: 300

# Theme: "Carbon Cosmos"
# A custom blend for the Elegoo Centauri Carbon 2 running COSMOS firmware.
# Layered charcoals, cyan accent, brightened status colours for a dark UI.

[theme]
# --- Brand accents ---------------------------------------------------------
primary_colour:     0x0096C7    # Electric Cyan (slightly deepened for white text)
secondary_colour:   0x1E2229    # Deep Charcoal

# --- Backgrounds & surfaces (three-tier charcoal stack) --------------------
bg_colour:          0x14171B    # Deepest layer
surface_colour:     0x1E2229    # Panels / cards
raised_colour:      0x2A3038    # Buttons & raised elements
selected_colour:    0x143D4A    # Muted cyan slot behind the active nav tab

# --- Lines & dividers ------------------------------------------------------
border_colour:      0x2F343B
border_dim_colour:  0x4A5058

# --- Type & glyphs ---------------------------------------------------------
text_colour:        0xFAFAFA
text_dim_colour:    0x9BA6B0
icon_colour:        0xE6EDF2
disabled_colour:    0x555C64

# Changed this to white so the selected tab matches the unselected tab text
on_primary_colour:  0xFFFFFF    

# --- Status colours --------------------------------------------------------
danger_colour:      0xEF5350
warning_colour:     0xFFB300
success_colour:     0x4CAF50
info_colour:        0x42A5F5